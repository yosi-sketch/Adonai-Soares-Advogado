<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD5" />
      <stop offset="25%" stop-color="#E5C07B" />
      <stop offset="65%" stop-color="#C8A876" />
      <stop offset="100%" stop-color="#8C6734" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E4" />
      <stop offset="100%" stop-color="#C8A876" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Top horizontal slab -->
    <rect x="176" y="58" width="160" height="18" rx="3" fill="url(#goldLight)" stroke="#3A2814" stroke-width="3" />

    <!-- Classical Capital Bar with volutes -->
    <path d="M 124 120 C 124 96 142 86 172 86 L 340 86 C 370 86 388 96 388 120 C 388 144 368 152 350 138 C 338 128 344 112 328 112 L 184 112 C 168 112 174 128 162 138 C 144 152 124 144 124 120 Z" 
          fill="url(#gold)" stroke="#3A2814" stroke-width="3" />

    <!-- Left Scroll Spiral -->
    <circle cx="146" cy="118" r="13" fill="#0c1017" stroke="#3A2814" stroke-width="2" />
    <circle cx="146" cy="118" r="8" fill="url(#goldLight)" />

    <!-- Right Scroll Spiral -->
    <circle cx="366" cy="118" r="13" fill="#0c1017" stroke="#3A2814" stroke-width="2" />
    <circle cx="366" cy="118" r="8" fill="url(#goldLight)" />

    <!-- H Pillar Left -->
    <polygon points="196,146 226,146 226,424 211,444 196,424" fill="url(#gold)" stroke="#3A2814" stroke-width="3" />

    <!-- Central Pillar (Shared H right / F stem) -->
    <polygon points="241,146 271,146 271,452 256,472 241,452" fill="url(#goldLight)" stroke="#3A2814" stroke-width="3" />

    <!-- F Pillar Right -->
    <polygon points="286,146 316,146 316,424 301,444 286,424" fill="url(#gold)" stroke="#3A2814" stroke-width="3" />

    <!-- H Crossbar -->
    <rect x="210" y="270" width="46" height="24" rx="2" fill="url(#goldLight)" stroke="#3A2814" stroke-width="2" />

    <!-- F Top Arm -->
    <polygon points="271,162 366,162 366,188 344,200 271,200" fill="url(#gold)" stroke="#3A2814" stroke-width="3" />

    <!-- F Middle Arm -->
    <polygon points="271,248 344,248 344,272 326,282 271,282" fill="url(#goldLight)" stroke="#3A2814" stroke-width="3" />
  </g>
</svg>